version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: splibilo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: pg
    ports:
      - '5435:5432'
    volumes:
      - splibil_pgdata:/var/lib/postgresql/data

  postgres_test:
    image: postgres:17
    container_name: splibilo-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: pg_test
    ports:
      - '5436:5432'
    volumes:
      - splibilo_pgdata_test:/var/lib/postgresql/data

volumes:
  splibil_pgdata:
  splibilo_pgdata_test:
